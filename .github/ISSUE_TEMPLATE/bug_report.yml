name: Bug report
description: Report a reproducible layout, rendering, or workflow bug.
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Screenshots and the generated HTML are the fastest way to make this actionable.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the issue clearly.
      placeholder: "The footer overlaps the final card on slide 6..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      placeholder: "The content should stay above the footer."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the prompt, source document, generated deck, or a minimal example.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Skill version, agent, browser, and OS.
      placeholder: "guizang-ppt-skill main / Claude / Chrome / macOS"
